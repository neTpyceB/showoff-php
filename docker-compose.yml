services:
  app:
    container_name: showoff-php-app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/app
    env_file:
      - env/app.env
    volumes:
      - ./:/var/www/app
      - composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stdin_open: true
    tty: true

  web:
    container_name: showoff-php-web
    image: nginx:1.28.2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/app:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q \"HTTP fundamentals\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    container_name: showoff-php-db
    image: mysql:9.4
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file:
      - env/mysql.env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  composer-cache:
  mysql-data:
