services:
  app:
    container_name: showoff-php-app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/app
    env_file:
      - env/app.env
    volumes:
      - ./:/var/www/app
      - composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stdin_open: true
    tty: true

  web:
    container_name: showoff-php-web
    image: nginx:1.28.2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_EXPOSE_PORT:-8081}:80"
    volumes:
      - ./:/var/www/app:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q \"HTTP fundamentals\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    container_name: showoff-php-db
    image: mysql:9.4
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file:
      - env/mysql.env
    ports:
      - "${DB_EXPOSE_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    container_name: showoff-php-redis
    image: redis:8.2-alpine
    ports:
      - "${REDIS_EXPOSE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    container_name: showoff-php-rabbitmq
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: showoff
      RABBITMQ_DEFAULT_PASS: showoff
    ports:
      - "${RABBITMQ_EXPOSE_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_EXPOSE_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  composer-cache:
  mysql-data:
