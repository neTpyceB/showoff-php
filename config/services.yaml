parameters:
  app.performance.http_cache_max_age: '%env(int:PERFORMANCE_HTTP_CACHE_MAX_AGE)%'
  app.performance.idempotency_ttl: '%env(int:PERFORMANCE_IDEMPOTENCY_TTL_SECONDS)%'
  app.performance.idempotency_lock_ttl: '%env(int:PERFORMANCE_LOCK_TTL_SECONDS)%'
  app.performance.slow_request_ms: '%env(int:PERFORMANCE_SLOW_REQUEST_MS)%'
  app.observability.structured_logging_enabled: '%env(bool:OBSERVABILITY_STRUCTURED_LOGGING_ENABLED)%'
  app.observability.metrics_token: '%env(OBSERVABILITY_METRICS_TOKEN)%'
  app.security.login_max_attempts: '%env(int:SECURITY_LOGIN_MAX_ATTEMPTS)%'
  app.security.login_window_seconds: '%env(int:SECURITY_LOGIN_WINDOW_SECONDS)%'
  app.security.api_token_max_attempts: '%env(int:SECURITY_API_TOKEN_MAX_ATTEMPTS)%'
  app.security.api_token_window_seconds: '%env(int:SECURITY_API_TOKEN_WINDOW_SECONDS)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Bootstrap/'
      - '../src/Container/'

  App\Factory\AppConfigFactory: ~
  Showoff\Core\Config\AppConfig:
    factory: ['@App\Factory\AppConfigFactory', 'create']
    arguments:
      - '%kernel.project_dir%'
    public: true

  App\Factory\PdoFactory: ~
  PDO:
    class: PDO
    factory: ['@App\Factory\PdoFactory', 'create']
    arguments:
      - '@Showoff\Core\Config\AppConfig'
    public: true

  Showoff\Core\Health\NativeRuntimeInspector: ~
  Showoff\Core\Health\RuntimeInspector: '@Showoff\Core\Health\NativeRuntimeInspector'
  Showoff\Core\Health\NativeDirectoryManager: ~
  Showoff\Core\Health\DirectoryManager: '@Showoff\Core\Health\NativeDirectoryManager'

  Showoff\Core\Persistence\Clock\SystemClock: ~
  Showoff\Core\Domain\Clock\Clock: '@Showoff\Core\Persistence\Clock\SystemClock'
  Showoff\Core\Persistence\Connection\PdoTransactionManager: ~
  Showoff\Core\Domain\Shared\TransactionBoundary: '@Showoff\Core\Persistence\Connection\PdoTransactionManager'
  Showoff\Core\Persistence\Contact\PdoContactSubmissionRepository: ~
  Showoff\Core\Domain\Contact\Repository\ContactSubmissionRepository: '@Showoff\Core\Persistence\Contact\PdoContactSubmissionRepository'
  Showoff\Core\Persistence\Contact\PdoContactSubmissionEventRepository: ~
  Showoff\Core\Domain\Contact\Repository\ContactSubmissionEventRepository: '@Showoff\Core\Persistence\Contact\PdoContactSubmissionEventRepository'

  Showoff\Core\Persistence\Migration\PdoMigratorFactory: ~
  Showoff\Core\Persistence\Migration\PdoMigrator:
    factory: ['@Showoff\Core\Persistence\Migration\PdoMigratorFactory', 'create']

  Showoff\Core\Config\ConfigRedactor: ~
  Showoff\Core\Health\SystemHealthChecker: ~
  Showoff\Core\Domain\Contact\SubmitContactSubmission: ~

  Showoff\Core\Http\Contact\HeaderSubmissionSourceStrategy: ~
  Showoff\Core\Http\Contact\SubmissionSourceStrategy: '@Showoff\Core\Http\Contact\HeaderSubmissionSourceStrategy'

  Showoff\Core\Http\Session\NativeSessionFactory: ~
  Showoff\Core\Http\Session\SessionFactory: '@Showoff\Core\Http\Session\NativeSessionFactory'
  Showoff\Core\Http\Session\WebSessionManager: ~

  App\Infrastructure\Cache\RedisCacheStore:
    arguments:
      $dsn: '%env(REDIS_DSN)%'
  App\Cache\CacheStore: '@App\Infrastructure\Cache\RedisCacheStore'

  App\Infrastructure\Lock\RedisRequestLockManager:
    arguments:
      $dsn: '%env(REDIS_DSN)%'
  App\Concurrency\RequestLockManager: '@App\Infrastructure\Lock\RedisRequestLockManager'

  App\Performance\Idempotency\IdempotencyService:
    arguments:
      $ttlSeconds: '%app.performance.idempotency_ttl%'
      $lockTtlSeconds: '%app.performance.idempotency_lock_ttl%'

  App\Performance\Http\JsonHttpCacheService:
    arguments:
      $defaultMaxAge: '%app.performance.http_cache_max_age%'

  App\Performance\Http\RequestProfilingSubscriber:
    arguments:
      $slowRequestThresholdMs: '%app.performance.slow_request_ms%'
      $structuredLoggingEnabled: '%app.observability.structured_logging_enabled%'

  App\Observability\Metrics\RequestMetricsStore:
    arguments:
      $slowRequestThresholdMs: '%app.performance.slow_request_ms%'

  App\Controller\Security\LoginController:
    arguments:
      $maxAttempts: '%app.security.login_max_attempts%'
      $windowSeconds: '%app.security.login_window_seconds%'

  App\Controller\Api\AuthTokenController:
    arguments:
      $maxAttempts: '%app.security.api_token_max_attempts%'
      $windowSeconds: '%app.security.api_token_window_seconds%'

  App\Controller\Operations\MetricsController:
    arguments:
      $metricsToken: '%app.observability.metrics_token%'

  App\Messaging\Publisher\RabbitMqMessagePublisher:
    arguments:
      $host: '%env(RABBITMQ_HOST)%'
      $port: '%env(int:RABBITMQ_PORT)%'
      $user: '%env(RABBITMQ_USER)%'
      $password: '%env(RABBITMQ_PASSWORD)%'
      $vhost: '%env(RABBITMQ_VHOST)%'
      $queueName: '%env(RABBITMQ_QUEUE)%'
  App\Messaging\Publisher\MessagePublisher: '@App\Messaging\Publisher\RabbitMqMessagePublisher'

  App\Messaging\ContactSubmissionEventConsumer:
    arguments:
      $host: '%env(RABBITMQ_HOST)%'
      $port: '%env(int:RABBITMQ_PORT)%'
      $user: '%env(RABBITMQ_USER)%'
      $password: '%env(RABBITMQ_PASSWORD)%'
      $vhost: '%env(RABBITMQ_VHOST)%'
      $queueName: '%env(RABBITMQ_QUEUE)%'
  App\Messaging\ContactSubmissionConsumer: '@App\Messaging\ContactSubmissionEventConsumer'

  Showoff\Core\Console\Command\:
    resource: '../packages/console/src/Console/Command/'
